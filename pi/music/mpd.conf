# MPD for her music: upmpdcli (the DLNA/UPnP speaker) hands it what to play,
# and it plays through PipeWire like her voice. Only reachable on the Pi.
music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/share/mpd/state"
bind_to_address     "127.0.0.1"
port                "6600"
auto_update         "no"

audio_output {
    type            "pulse"
    name            "Music"
}
