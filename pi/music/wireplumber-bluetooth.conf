# Bluetooth audio on a headless Pi. WirePlumber normally only runs Bluetooth
# for a user logged in at a local seat; she has none (linger), so turn that
# off. And only A2DP: the headset profile would use the speaker's mic and
# drop the music to phone quality.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}

# Keep the speaker's stream open between sounds: waking a suspended
# Bluetooth link loses the first fraction of a second (her first word).
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
