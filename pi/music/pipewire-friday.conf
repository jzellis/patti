# Her sound on friday's speakers (the cortex PC), over the network, whenever
# friday's there: a "friday" output that WirePlumber prefers (priority) over
# her own speaker. Her voice, the page's Say box and intercom, and music all
# follow the default output, so they all go there. If friday is off, the
# output goes away and everything falls back; this keeps trying to reach
# friday every few seconds. Away from home friday's still reachable (over
# Tailscale), so the brain picks another output then (brain/outputs.py).
#
# friday's side: PipeWire's PulseAudio server listening on TCP 4713, and a
# firewall letting only Tailscale in (see .claude/memory/cortex-pc.md).
#
# Installed by install.sh as ~/.config/pipewire/pipewire.conf.d/60-friday.conf
context.modules = [
    {   name = libpipewire-module-pulse-tunnel
        args = {
            tunnel.mode = sink
            pulse.server.address = "tcp:friday:4713"
            target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            pulse.latency = 200
            reconnect.interval.ms = 5000
            stream.props = {
                node.name = "friday"
                node.description = "friday speakers"
                priority.session = 2500
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
