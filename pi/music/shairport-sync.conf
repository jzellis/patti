// AirPlay speaker for the iPhone. Track details go out on the session bus
// (MPRIS and its own interface), where the brain reads them.
//
// Sound goes through ALSA's "pipewire" device (pipewire-alsa), not the "pa"
// backend: through pipewire-pulse its stream stayed corked, so shairport-sync
// fell further and further behind and never played a note.
general = {
    name = "Patti";
    output_backend = "alsa";
    mpris_service_bus = "session";
    dbus_service_bus = "session";
    // The phone's AirPlay volume over 30 dB, not 60, so most of its slider is
    // audible; a longer buffer and a looser resync for the Bluetooth link,
    // which otherwise underran and kept resyncing.
    volume_range_db = 30;
    audio_backend_buffer_desired_length_in_seconds = 0.5;
    resync_threshold_in_seconds = 0.2;
};
alsa = {
    output_device = "pipewire";
};
metadata = {
    enabled = "yes";
    include_cover_art = "no";
};
