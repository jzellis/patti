# Patti: the UGREEN camera's mic as "rpmic", shareable, so voice
# commands (brain/voice.py) can listen while a recording also uses it. A
# plain hw: or plughw: device can only be opened by one program at a time.
# Installed to /etc/alsa/conf.d/ by install.sh.
#
#   arecord -D rpmic -f S16_LE -r 16000 -c 1 test.wav    (converts as needed)

pcm.rpmic_snoop {
    type dsnoop
    ipc_key 5978
    ipc_perm 0666
    slave {
        pcm "hw:CARD=Camera,DEV=0"
        channels 2
        rate 48000
        format S16_LE
        period_size 1024
        buffer_size 32768       # ~0.7 s: ffmpeg reads in bursts; 8192 (0.17 s) overran and lost most of the sound
    }
}

pcm.rpmic {
    type plug
    slave.pcm "rpmic_snoop"
    hint.description "Patti's camera mic (shared)"
}
